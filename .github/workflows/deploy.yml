name: Marmoyo Smart-Dine CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Automated Testing & Build Validation (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, pgsql, pdo_sqlite, sqlite3, bcmath, fileinfo
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install NPM Dependencies & Build Vite Assets
        run: |
          npm ci || npm install
          npm run build

      - name: Prepare Test Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Test Suite
        run: php artisan test

  deploy:
    name: Production Deployment to Vercel (CD)
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js for Vercel CLI
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "Pulling Vercel Environment Configuration..."
            vercel pull --yes --environment=production --token=$VERCEL_TOKEN
            echo "Building Artifacts..."
            vercel build --prod --token=$VERCEL_TOKEN
            echo "Deploying to Vercel Production..."
            vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
          else
            echo "Notice: VERCEL_TOKEN secret is not set in GitHub Repository Secrets."
            echo "If your repository is already connected to Vercel via Vercel Git Integration, Vercel will automatically deploy from the git push."
          fi

